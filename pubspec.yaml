name: sumahono_mobile
description: かわいい系のシンプルなモバイルアプリ
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # 状態管理
  provider: ^6.1.1

  # ナビゲーション
  go_router: ^12.1.3

  # ローカルストレージ
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3

  # UI・アニメーション
  flutter_animate: ^4.2.0
  lottie: ^2.7.0

  # かわいい系アイコン・フォント
  google_fonts: ^6.1.0

  # 画像処理
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0

  # 通知
  flutter_local_notifications: ^19.4.0

  # 設定管理
  settings_ui: ^2.0.2

  # その他の便利なパッケージ
  intl: ^0.18.1
  uuid: ^4.2.1
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # コード品質向上
  flutter_lints: ^3.0.0

  # テスト関連
  mockito: ^5.4.4
  build_runner: ^2.4.7

flutter:
  # アセット設定
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

  # プラットフォーム固有の設定
  uses-material-design: true
